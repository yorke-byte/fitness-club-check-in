<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fitness Club QR Check-In</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green-bg: rgba(16, 185, 129, 0.15);
      --green-border: #10b981;
      --green-text: #34d399;
      --red-bg: rgba(239, 68, 68, 0.15);
      --red-border: #ef4444;
      --red-text: #f87171;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* PIN LOCK OVERLAY */
    .pin-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .pin-screen.hidden { display: none; }

    .pin-box {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    .pin-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .pin-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .pin-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      transition: all 0.15s ease;
    }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
    .pin-dot.error { background: var(--red-border); border-color: var(--red-border); }

    .pin-error {
      min-height: 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--red-text);
      margin-bottom: 10px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .key-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      height: 54px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .key-btn:active { background: var(--surface-2); transform: scale(0.97); }
    .key-btn.action { font-size: 14px; font-weight: 700; color: var(--muted); }
    .key-btn.enter { background: var(--accent); border-color: var(--accent); color: #0f172a; font-size: 15px; }

    /* MAIN APP SHELL */
    .app-shell {
      width: 100%;
      max-width: 1120px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(10px, 2vw, 20px);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.8vw, 16px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      flex-shrink: 0;
    }

    .sync-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(12px, 1.5vw, 13px);
      font-weight: 600;
      color: var(--muted);
      min-width: 0;
    }
    .sync-badge span:last-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }
    .dot.live { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.syncing { background: #f59e0b; }
    .dot.error { background: #ef4444; }

    .nav-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      padding: 3px;
      border-radius: 10px;
    }

    .tab-btn, .lock-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--surface-2); color: var(--text); }
    .lock-btn { background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; }
    .lock-btn:hover { color: var(--text); }

    .view { display: none; flex: 1; }
    .view.active { display: flex; flex-direction: column; gap: clamp(10px, 1.8vw, 16px); }

    .scanner-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: minmax(250px, 1fr) auto;
      gap: clamp(12px, 2vw, 20px);
      align-items: stretch;
    }

    @media (min-width: 768px) {
      .scanner-grid {
        grid-template-columns: 1.15fr 1fr;
        grid-template-rows: 1fr;
        min-height: 400px;
      }
    }

    /* Camera Box */
    .camera-card {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 250px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #reader { width: 100%; height: 100%; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
    #reader__scan_region img { display: none !important; }
    #reader__dashboard { display: none !important; }

    .reticle {
      position: absolute;
      width: clamp(160px, 34vw, 240px);
      height: clamp(160px, 34vw, 240px);
      border: 2px solid rgba(56, 189, 248, 0.8);
      border-radius: 20px;
      box-shadow: 0 0 0 9999px rgba(2, 6, 23, 0.42);
      pointer-events: none;
      z-index: 2;
    }

    .camera-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
      z-index: 3;
    }
    .camera-overlay.hidden { display: none; }

    .cam-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 11px 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    .cam-controls-bar {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 4;
      display: flex;
      gap: 6px;
    }

    .cam-toggle-pill {
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Main Status Result Card */
    .result-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: clamp(16px, 3vw, 28px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      transition: border-color 0.2s ease;
    }
    .result-card.cleared { border-color: var(--green-border); }
    .result-card.incomplete { border-color: var(--red-border); }
    .result-card.unknown { border-color: #f59e0b; }

    .student-first-name {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: clamp(14px, 2.5vw, 24px);
      word-break: break-word;
    }
    .student-first-name.idle {
      font-size: clamp(18px, 2.4vw, 24px);
      font-weight: 600;
      color: var(--muted);
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 2vw, 16px);
    }

    .status-tile {
      border-radius: 16px;
      padding: clamp(14px, 2.5vw, 24px) 10px;
      border: 2px solid var(--border);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .status-tile.yes { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
    .status-tile.no { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }

    .status-icon { font-size: clamp(34px, 5vw, 52px); font-weight: 900; line-height: 1; }
    .status-label { font-size: clamp(12px, 1.5vw, 14px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text); }

    /* Admin Tab */
    .admin-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 768px) { .admin-grid { grid-template-columns: 1fr 1fr; } }

    .admin-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .admin-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .row { display: flex; gap: 8px; }

    input[type="text"], input[type="url"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn.primary { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }

    .meta-text { font-size: 12px; color: var(--muted); line-height: 1.45; }

    .list-box { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- TEACHER PIN LOCK SCREEN -->
  <div id="pinScreen" class="pin-screen">
    <div class="pin-box">
      <div class="pin-title">Teacher Access</div>
      <div class="pin-sub">Enter PIN to open Fitness Club Scanner</div>
      <div id="pinDots" class="pin-dots">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <div id="pinError" class="pin-error"></div>
      <div class="keypad">
        <button type="button" class="key-btn" onclick="pressPin('1')">1</button>
        <button type="button" class="key-btn" onclick="pressPin('2')">2</button>
        <button type="button" class="key-btn" onclick="pressPin('3')">3</button>
        <button type="button" class="key-btn" onclick="pressPin('4')">4</button>
        <button type="button" class="key-btn" onclick="pressPin('5')">5</button>
        <button type="button" class="key-btn" onclick="pressPin('6')">6</button>
        <button type="button" class="key-btn" onclick="pressPin('7')">7</button>
        <button type="button" class="key-btn" onclick="pressPin('8')">8</button>
        <button type="button" class="key-btn" onclick="pressPin('9')">9</button>
        <button type="button" class="key-btn action" onclick="clearPin()">Clear</button>
        <button type="button" class="key-btn" onclick="pressPin('0')">0</button>
        <button type="button" class="key-btn enter" onclick="submitPin()">Unlock</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="app-shell">
    <div class="topbar">
      <div class="sync-badge">
        <span id="syncDot" class="dot syncing"></span>
        <span id="syncStatusText">Syncing sheet...</span>
      </div>
      <div class="nav-actions">
        <div class="tabs">
          <button class="tab-btn active" id="tabScanner" onclick="switchTab('scanner')">Scanner</button>
          <button class="tab-btn" id="tabAdmin" onclick="switchTab('admin')">Admin</button>
        </div>
        <button class="lock-btn" onclick="lockApp()" title="Lock screen">Lock</button>
      </div>
    </div>

    <!-- MAIN SCANNER VIEW -->
    <div id="viewScanner" class="view active">
      <div class="scanner-grid">
        <div class="camera-card">
          <div id="reader"></div>
          <div id="reticle" class="reticle" style="display:none;"></div>
          <div id="camControlsBar" class="cam-controls-bar" style="display:none;">
            <button type="button" class="cam-toggle-pill" onclick="switchCamera()">Flip</button>
            <button type="button" class="cam-toggle-pill" onclick="stopCamera()">Pause</button>
          </div>
          <div id="cameraOverlay" class="camera-overlay">
            <div id="cameraMsg" style="font-size:15px; color:#e2e8f0; font-weight:600;">Waiting for PIN unlock...</div>
            <div id="cameraSubMsg" style="font-size:12px; color:#94a3b8; max-width:300px; line-height:1.4;"></div>
            <button type="button" id="startCamBtn" class="cam-btn" style="display:none;" onclick="startCamera()">Enable Camera</button>
          </div>
        </div>

        <div id="resultCard" class="result-card">
          <div id="firstNameDisplay" class="student-first-name idle">Ready to scan Student ID</div>
          <div class="status-grid">
            <div id="waiverTile" class="status-tile">
              <div id="waiverIcon" class="status-icon">—</div>
              <div class="status-label">Waiver Signed</div>
            </div>
            <div id="paidTile" class="status-tile">
              <div id="paidIcon" class="status-icon">—</div>
              <div class="status-label">Paid</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="viewAdmin" class="view">
      <div class="admin-grid">
        <div class="admin-card">
          <div class="admin-title">Live Google Sheet Sync</div>
          <div class="row">
            <input type="url" id="sheetUrlInput" />
            <button class="btn primary" onclick="saveAndSyncUrl()">Sync Now</button>
          </div>
          <div id="syncDetails" class="meta-text">Checking live sheet...</div>
        </div>

        <div class="admin-card">
          <div class="admin-title">Manual Lookup &amp; Test</div>
          <form class="row" onsubmit="handleManualSubmit(event)">
            <input type="text" id="manualIdInput" placeholder="Enter or scan Student Number..." />
            <button type="submit" class="btn primary">Check</button>
          </form>
          <div class="chips">
            <button type="button" class="chip" onclick="testScan('5474')">Cleared (5474)</button>
            <button type="button" class="chip" onclick="testScan('108878695')">Missing Waiver</button>
            <button type="button" class="chip" onclick="testScan('7498')">Unpaid</button>
            <button type="button" class="chip" onclick="testScan('999999')">Unknown ID</button>
          </div>
        </div>

        <div class="admin-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="admin-title">Recent Scans</div>
            <button class="btn" style="padding:3px 8px; font-size:11px;" onclick="clearLogs()">Clear</button>
          </div>
          <div id="scanLogList" class="list-box">
            <div class="meta-text">No scans recorded yet.</div>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-title">Loaded Roster (<span id="rosterCount">0</span>)</div>
          <input type="text" id="rosterSearchInput" placeholder="Filter by name or student number..." oninput="renderRosterList()" />
          <div id="rosterList" class="list-box"></div>
        </div>
      </div>
    </div>
  </div>

      {"id":"4971","firstName":"Dmytro","lastInitial":"S.","waiver":true,"paid":true},
      {"id":"4972","firstName":"Roman","lastInitial":"S.","waiver":true,"paid":true},
      {"id":"108341892","firstName":"Kyle","lastInitial":"S.","waiver":true,"paid":true},
      {"id":"108875766","firstName":"Tristan","lastInitial":"S.","waiver":true,"paid":true},
      {"id":"3154","firstName":"Jasfer","lastInitial":"T.","waiver":true,"paid":true},
      {"id":"108609074","firstName":"Stella","lastInitial":"T.","waiver":true,"paid":true},
      {"id":"11733","firstName":"Hendry","lastInitial":"T.","waiver":true,"paid":true},
      {"id":"108345620","firstName":"Hailey","lastInitial":"U.","waiver":true,"paid":true},
      {"id":"5297","firstName":"Vanessa Reighn","lastInitial":"V.","waiver":true,"paid":true},
      {"id":"7374","firstName":"Yelysei","lastInitial":"V.","waiver":true,"paid":true},
      {"id":"11938","firstName":"Camila","lastInitial":"V.","waiver":true,"paid":true},
      {"id":"7482","firstName":"Mariana","lastInitial":"S.","waiver":false,"paid":false},
      {"id":"108878489","firstName":"Chet","lastInitial":"W.","waiver":true,"paid":true}
    ];

    let enteredPin = "";
    let isUnlocked = false;
    let rosterMap = new Map();
    let rosterList = [];
    let scanLogs = [];
    let html5QrCode = null;
    let isCameraRunning = false;
    let availableCameras = [];
    let currentCamIndex = 0;
    let lastScannedCode = "";
    let lastScanTime = 0;

    function toLastInitial(val) {
      const clean = String(val || "").trim();
      if (!clean) return "";
      return `${clean.charAt(0).toUpperCase()}.`;
    }

    function normalizeRecord(item) {
      const rawLast = item.lastInitial !== undefined ? item.lastInitial : (item.lastName || "");
      return {
        id: String(item.id || "").trim(),
        firstName: String(item.firstName || "").trim(),
        lastInitial: toLastInitial(rawLast),
        waiver: Boolean(item.waiver),
        paid: Boolean(item.paid)
      };
    }

    /* PIN LOGIC */
    function renderPinDots(isError = false) {
      const container = document.getElementById("pinDots");
      const len = Math.max(TEACHER_PIN.length, 4);
      let html = "";
      for (let i = 0; i < len; i++) {
        const cls = isError ? "pin-dot error" : (i < enteredPin.length ? "pin-dot filled" : "pin-dot");
        html += `<div class="${cls}"></div>`;
      }
      container.innerHTML = html;
    }

    function pressPin(digit) {
      if (isUnlocked) return;
      document.getElementById("pinError").textContent = "";
      if (enteredPin.length < TEACHER_PIN.length) {
        enteredPin += digit;
        renderPinDots(false);
        if (enteredPin.length === TEACHER_PIN.length) {
          setTimeout(submitPin, 120);
        }
      }
    }

    function clearPin() {
      enteredPin = "";
      document.getElementById("pinError").textContent = "";
      renderPinDots(false);
    }

    function submitPin() {
      if (enteredPin === TEACHER_PIN) {
        unlockApp();
      } else {
        document.getElementById("pinError").textContent = "Incorrect PIN";
        renderPinDots(true);
        enteredPin = "";
        setTimeout(() => renderPinDots(false), 600);
      }
    }

    function unlockApp() {
      isUnlocked = true;
      enteredPin = "";
      sessionStorage.setItem(SESSION_UNLOCK_KEY, "1");
      document.getElementById("pinScreen").classList.add("hidden");
      startCamera();
    }

    function lockApp() {
      isUnlocked = false;
      enteredPin = "";
      sessionStorage.removeItem(SESSION_UNLOCK_KEY);
      stopCamera();
      renderPinDots(false);
      document.getElementById("pinError").textContent = "";
      document.getElementById("pinScreen").classList.remove("hidden");
    }

    document.addEventListener("keydown", (e) => {
      if (isUnlocked) return;
      if (e.key >= "0" && e.key <= "9") pressPin(e.key);
      else if (e.key === "Backspace") {
        enteredPin = enteredPin.slice(0, -1);
        document.getElementById("pinError").textContent = "";
        renderPinDots(false);
      } else if (e.key === "Enter") submitPin();
    });

    /* ROSTER & GOOGLE SHEET SYNC */
    function loadRosterIntoMemory(records) {
      rosterMap.clear();
      rosterList = records.map(normalizeRecord).filter(r => r.id && r.firstName);
      rosterList.forEach(item => rosterMap.set(item.id, item));
      document.getElementById("rosterCount").textContent = rosterList.length;
      renderRosterList();
    }

    function parseBool(val) {
      const s = String(val ?? "").trim().toLowerCase();
      return s === "true" || s === "yes" || s === "1" || s === "y" || s === "x" || s === "paid" || s === "signed";
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') { cur += '"'; i++; }
          else if (ch === '"') { inQuotes = false; }
          else { cur += ch; }
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(cur); cur = ""; }
          else if (ch === '\r' && next === '\n') { row.push(cur); rows.push(row); row = []; cur = ""; i++; }
          else if (ch === '\n' || ch === '\r') { row.push(cur); rows.push(row); row = []; cur = ""; }
          else cur += ch;
        }
      }
      if (cur.length > 0 || row.length > 0) { row.push(cur); rows.push(row); }
      if (rows.length < 2) return [];

      const headers = rows[0].map(h => h.trim().toLowerCase());
      const idxId = headers.findIndex(h => h.includes("student number") || h === "id" || h.includes("student id"));
      const idxFirst = headers.findIndex(h => h.includes("first name") || h === "first");
      const idxLast = headers.findIndex(h => h.includes("last name") || h === "last");
      const idxWaiver = headers.findIndex(h => h.includes("waiver"));
      const idxPaid = headers.findIndex(h => h.includes("paid"));

      if (idxId === -1 || idxFirst === -1) throw new Error("Missing 'Student Number' or 'First Name' columns.");

      const parsed = [];
      for (let r = 1; r < rows.length; r++) {
        const cols = rows[r];
        const rawId = (cols[idxId] || "").trim();
        const firstName = (cols[idxFirst] || "").trim();
        if (!rawId || !firstName) continue;

        const lastInitial = idxLast !== -1 ? toLastInitial(cols[idxLast]) : "";
        const waiver = idxWaiver !== -1 ? parseBool(cols[idxWaiver]) : false;
        const paid = idxPaid !== -1 ? parseBool(cols[idxPaid]) : false;

        rawId.split("/").forEach(part => {
          const id = part.trim();
          if (id) parsed.push({ id, firstName, lastInitial, waiver, paid });
        });
      }
      return parsed;
    }

    async function syncFromGoogleSheet(url) {
      const dot = document.getElementById("syncDot");
      const statusText = document.getElementById("syncStatusText");
      const details = document.getElementById("syncDetails");

      dot.className = "dot syncing";
      statusText.textContent = "Syncing...";

      try {
        const sep = url.includes("?") ? "&" : "?";
        const res = await fetch(`${url}${sep}_cb=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csvText = await res.text();
        const records = parseCSV(csvText);
        if (!records.length) throw new Error("No valid student rows found.");

        loadRosterIntoMemory(records);
        const nowStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        localStorage.setItem(STORAGE_DATA_KEY, JSON.stringify(rosterList));
        localStorage.setItem(STORAGE_TIME_KEY, nowStr);

        dot.className = "dot live";
        statusText.textContent = `Live • ${rosterList.length} students`;
        details.textContent = `Synced ${rosterList.length} student IDs at ${nowStr}.`;
      } catch (err) {
        dot.className = "dot error";
        const cachedTime = localStorage.getItem(STORAGE_TIME_KEY);
        statusText.textContent = `Cached • ${rosterList.length} students`;
        details.textContent = `Using offline/cached roster (${rosterList.length} IDs)${cachedTime ? ` from ${cachedTime}` : ""}. Sync error: ${err.message}`;
      }
    }

    function saveAndSyncUrl() {
      const url = document.getElementById("sheetUrlInput").value.trim();
      if (!url) return;
      localStorage.setItem(STORAGE_URL_KEY, url);
      syncFromGoogleSheet(url);
    }

    /* SCANNER & LOOKUP */
    function playTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === "ok") {
          osc.frequency.setValueAtTime(660, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        } else {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
          osc.start();
          osc.stop(ctx.currentTime + 0.28);
        }
      } catch (_) {}
    }

    function extractStudentNumber(rawText) {
      const trimmed = String(rawText || "").trim();
      if (rosterMap.has(trimmed)) return trimmed;
      const digits = trimmed.match(/\d{3,12}/);
      if (digits && rosterMap.has(digits[0])) return digits[0];
      return digits ? digits[0] : trimmed;
    }

    function lookupStudent(rawInput) {
      const id = extractStudentNumber(rawInput);
      if (!id) return;

      const card = document.getElementById("resultCard");
      const nameEl = document.getElementById("firstNameDisplay");
      const waiverTile = document.getElementById("waiverTile");
      const waiverIcon = document.getElementById("waiverIcon");
      const paidTile = document.getElementById("paidTile");
      const paidIcon = document.getElementById("paidIcon");

      const student = rosterMap.get(id);
      const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      if (!student) {
        card.className = "result-card unknown";
        nameEl.className = "student-first-name";
        nameEl.textContent = `Not Found (${id})`;

        waiverTile.className = "status-tile no";
        waiverIcon.textContent = "✗";
        paidTile.className = "status-tile no";
        paidIcon.textContent = "✗";

        playTone("warn");
        scanLogs.unshift({ time: timeStr, id, name: "Not Found", ok: false });
      } else {
        const cleared = student.waiver && student.paid;
        card.className = cleared ? "result-card cleared" : "result-card incomplete";
        nameEl.className = "student-first-name";
        nameEl.textContent = student.firstName;

        waiverTile.className = student.waiver ? "status-tile yes" : "status-tile no";
        waiverIcon.textContent = student.waiver ? "✓" : "✗";

        paidTile.className = student.paid ? "status-tile yes" : "status-tile no";
        paidIcon.textContent = student.paid ? "✓" : "✗";

        playTone(cleared ? "ok" : "warn");
        scanLogs.unshift({
          time: timeStr,
          id,
          name: `${student.firstName} ${student.lastInitial}`.trim(),
          ok: cleared
        });
      }

      if (scanLogs.length > 50) scanLogs.pop();
      renderLogs();
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      const input = document.getElementById("manualIdInput");
      if (!input.value.trim()) return;
      lookupStudent(input.value);
      input.value = "";
      switchTab("scanner");
    }

    function testScan(id) {
      lookupStudent(id);
      switchTab("scanner");
    }

    function renderLogs() {
      const container = document.getElementById("scanLogList");
      if (!scanLogs.length) {
        container.innerHTML = '<div class="meta-text">No scans recorded yet.</div>';
        return;
      }
      container.innerHTML = scanLogs.map(log => `
        <div class="list-item">
          <div>
            <strong>${escapeHtml(log.name)}</strong>
            <span style="color:var(--muted); font-size:12px;">#${escapeHtml(log.id)}</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="color:${log.ok ? '#34d399' : '#f87171'}; font-weight:700;">${log.ok ? '✓' : '✗'}</span>
            <span style="color:var(--muted); font-size:11px;">${log.time}</span>
          </div>
        </div>
      `).join("");
    }

    function clearLogs() { scanLogs = []; renderLogs(); }

    function renderRosterList() {
      const q = (document.getElementById("rosterSearchInput").value || "").trim().toLowerCase();
      const container = document.getElementById("rosterList");
      const filtered = rosterList.filter(s =>
        !q || s.firstName.toLowerCase().includes(q) || s.lastInitial.toLowerCase().includes(q) || s.id.includes(q)
      ).slice(0, 80);

      container.innerHTML = filtered.map(s => `
        <div class="list-item" style="cursor:pointer;" onclick="testScan('${escapeHtml(s.id)}')">
          <div>
            <strong>${escapeHtml(s.firstName)} ${escapeHtml(s.lastInitial)}</strong>
            <span style="color:var(--muted); font-size:12px;">#${escapeHtml(s.id)}</span>
          </div>
          <div style="font-size:12px; font-weight:700;">
            <span style="color:${s.waiver ? '#34d399' : '#f87171'};">W:${s.waiver ? '✓' : '✗'}</span>
            &nbsp;
            <span style="color:${s.paid ? '#34d399' : '#f87171'};">P:${s.paid ? '✓' : '✗'}</span>
          </div>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function switchTab(tab) {
      document.getElementById("tabScanner").classList.toggle("active", tab === "scanner");
      document.getElementById("tabAdmin").classList.toggle("active", tab === "admin");
      document.getElementById("viewScanner").classList.toggle("active", tab === "scanner");
      document.getElementById("viewAdmin").classList.toggle("active", tab === "admin");
    }

    /* LIVE CAMERA CONTROL */
    function onQrDecoded(decodedText) {
      const now = Date.now();
      if (decodedText === lastScannedCode && now - lastScanTime < 2500) return;
      lastScannedCode = decodedText;
      lastScanTime = now;
      lookupStudent(decodedText);
    }

    async function startCamera(forceDeviceId = null) {
      if (!isUnlocked) return;
      const overlay = document.getElementById("cameraOverlay");
      const msg = document.getElementById("cameraMsg");
      const subMsg = document.getElementById("cameraSubMsg");
      const btn = document.getElementById("startCamBtn");
      const reticle = document.getElementById("reticle");
      const controlsBar = document.getElementById("camControlsBar");

      overlay.classList.remove("hidden");
      btn.style.display = "none";
      msg.textContent = "Starting camera...";
      subMsg.textContent = "";

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Camera API unavailable in this browser context.");
        }

        if (!availableCameras.length) {
          const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
          tempStream.getTracks().forEach(t => t.stop());
          availableCameras = await Html5Qrcode.getCameras();
          const backIdx = availableCameras.findIndex(c => /back|rear|environment/i.test(c.label));
          if (backIdx !== -1) currentCamIndex = backIdx;
        }

        if (html5QrCode && isCameraRunning) {
          await html5QrCode.stop();
          isCameraRunning = false;
        }
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }

        const cameraTarget = forceDeviceId
          || (availableCameras[currentCamIndex] ? availableCameras[currentCamIndex].id : { facingMode: "environment" });

        await html5QrCode.start(
          cameraTarget,
          { fps: 12, qrbox: { width: 190, height: 190 } },
          onQrDecoded,
          () => {}
        );

        isCameraRunning = true;
        overlay.classList.add("hidden");
        reticle.style.display = "block";
        controlsBar.style.display = "flex";
      } catch (err) {
        isCameraRunning = false;
        reticle.style.display = "none";
        controlsBar.style.display = "none";
        msg.textContent = "Camera permission needed";
        subMsg.textContent = "Tap Enable Camera below and allow camera access when prompted.";
        btn.style.display = "inline-block";
      }
    }

    async function switchCamera() {
      if (availableCameras.length < 2) return;
      currentCamIndex = (currentCamIndex + 1) % availableCameras.length;
      await startCamera(availableCameras[currentCamIndex].id);
    }

    async function stopCamera() {
      if (html5QrCode && isCameraRunning) {
        try { await html5QrCode.stop(); } catch (_) {}
      }
      isCameraRunning = false;
      document.getElementById("reticle").style.display = "none";
      document.getElementById("camControlsBar").style.display = "none";
      document.getElementById("cameraMsg").textContent = "Camera paused";
      document.getElementById("cameraSubMsg").textContent = "";
      document.getElementById("startCamBtn").style.display = "inline-block";
      document.getElementById("cameraOverlay").classList.remove("hidden");
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderPinDots(false);
      localStorage.removeItem("fc_roster_cache_v1");

      try {
        const cached = JSON.parse(localStorage.getItem(STORAGE_DATA_KEY) || "null");
        loadRosterIntoMemory(Array.isArray(cached) && cached.length ? cached : FALLBACK_ROSTER);
      } catch (_) {
        loadRosterIntoMemory(FALLBACK_ROSTER);
      }

      const savedUrl = localStorage.getItem(STORAGE_URL_KEY) || DEFAULT_SHEET_URL;
      document.getElementById("sheetUrlInput").value = savedUrl;
      syncFromGoogleSheet(savedUrl);

      if (sessionStorage.getItem(SESSION_UNLOCK_KEY) === "1") {
        unlockApp();
      }
    });
  </script>
